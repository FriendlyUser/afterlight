<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>body{background:#6a8a5a;margin:0;padding:8px;font:12px sans-serif;color:#fff} canvas{image-rendering:pixelated;display:block} .row{display:flex;gap:10px;align-items:flex-end;margin-bottom:6px}</style></head><body>
<!-- The Emberhart mount sheet for a few riders (?who=wren,pip,bram&scale=4&night=1). -->
<script type="module">
import { getMountSheet } from '../src/render/MountFactory.js';
import { LOOKS } from '../src/data/looks.js';
const q = new URLSearchParams(location.search);
const scale = +(q.get('scale') || 4);
if (q.get('night')) document.body.style.background = '#1a1a30';
for (const who of (q.get('who') || 'wren,pip,bram').split(',')) {
  const s = getMountSheet(LOOKS[who]);
  const c = document.createElement('canvas');
  c.width = s.canvas.width * scale; c.height = s.canvas.height * scale;
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(s.canvas, 0, 0, c.width, c.height);
  const row = document.createElement('div'); row.className = 'row'; row.append(who, c); document.body.appendChild(row);
}
</script></body></html>
